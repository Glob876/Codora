name: Checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - run: node desktop/node_modules/electron/install.js
      - run: python3 scripts/dictionaries.py
      - run: ./scripts/check.sh
      - run: cargo build --release --locked
      - run: xvfb-run -a desktop/node_modules/.bin/electron desktop/smoke.cjs
