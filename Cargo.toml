[package]
name = "typoha"
version = "0.1.0"
edition = "2024"
description = "Independent local Markdown editor"
license = "MIT"
rust-version = "1.90"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
rust-embed = "8"
mime_guess = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
