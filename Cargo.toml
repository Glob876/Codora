[package]
name = "codora"
version = "0.1.0"
edition = "2024"
description = "Independent local code and Markdown editor"
license = "AGPL-3.0-or-later"
rust-version = "1.90"

[features]
default = ["web"]
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess", "dep:base64"]

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
tui-textarea = { version = "=0.7.0", features = ["search"] }
pulldown-cmark = "=0.13.0"
toml = "=0.8.23"

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
